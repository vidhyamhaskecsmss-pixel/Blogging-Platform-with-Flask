{% extends "base.html" %}
{% block title %}Write a post | BlogSpace{% endblock %}
{% block content %}
<section class="form-page">
  <p class="eyebrow">NEW STORY</p>
  <h1>Write a blog post</h1>
  <p class="muted">Give your post a clear title and share your thoughts.</p>
  <form class="editor-form" method="POST">
    <label for="title">Post title</label>
    <input id="title" name="title" type="text" maxlength="200" required placeholder="Enter an interesting title">
    <label for="content">Content</label>
    <textarea id="content" name="content" rows="12" required placeholder="Start writing here..."></textarea>
    <div class="form-actions">
      <a class="button button-light" href="{{ url_for('home') }}">Cancel</a>
      <button class="button" type="submit">Publish post</button>
    </div>
  </form>
</section>
{% endblock %}
