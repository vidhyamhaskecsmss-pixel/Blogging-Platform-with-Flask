{% extends "base.html" %}
{% block title %}Login | BlogSpace{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in</h1>
    <p class="muted">Continue sharing your ideas.</p>
    <form method="POST">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
      <button class="button full-width" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New to BlogSpace? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
</div>
{% endblock %}
