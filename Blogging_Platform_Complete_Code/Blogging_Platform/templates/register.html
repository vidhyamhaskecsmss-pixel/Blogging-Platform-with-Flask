{% extends "base.html" %}
{% block title %}Create account | BlogSpace{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth-card">
    <p class="eyebrow">JOIN THE COMMUNITY</p>
    <h1>Create your account</h1>
    <p class="muted">Sign up to publish posts and leave comments.</p>
    <form method="POST">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" minlength="3" maxlength="80" required autocomplete="username" placeholder="Choose a username">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" maxlength="120" required autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
      <button class="button full-width" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </section>
</div>
{% endblock %}
