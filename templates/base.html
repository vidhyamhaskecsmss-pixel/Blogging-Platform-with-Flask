<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BlogSpace{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="{{ url_for('home') }}">BlogSpace</a>
     
<nav>
    <a href="{{ url_for('home') }}">Home</a>

    {% if current_user.is_authenticated %}

        <a href="{{ url_for('create_post') }}">Write a post</a>

        <a href="{{ url_for('profile', user_id=current_user.id) }}">
            My Profile
        </a>

        <span class="nav-user">
            Hi, {{ current_user.username }}
        </span>

        <form class="inline-form" method="POST"
              action="{{ url_for('logout') }}">
            <button class="nav-button" type="submit">
                Logout
            </button>
        </form>

    {% else %}

        <a href="{{ url_for('login') }}">Login</a>

        <a class="nav-cta" href="{{ url_for('register') }}">
            Create account
        </a>

    {% endif %}
</nav>
